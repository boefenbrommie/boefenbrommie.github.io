<!DOCTYPE html>
<html lang="nl">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Contact – Boef & Brommie</title>

<meta name="description" content="Neem contact op met Boef & Brommie. Stel een vraag, geef een reactie of stuur een bericht.">

<link rel="icon" type="image/png" href="favicon.png">

<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Lobster+Two&display=swap" rel="stylesheet">

<!-- Google Analytics -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-9CGG9GV25Y"></script>

<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());
gtag('config', 'G-9CGG9GV25Y');
</script>

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:#f7f7f7;
color:#333;
}

.container{
max-width:900px;
margin:0 auto;
padding:40px 20px;
background:#fff;
box-sizing:border-box;
}

/* ================= NAVBAR ================= */

.navbar{
background:#0179F1;
border-radius:20px;
padding:18px 20px;
margin-bottom:30px;
}

.nav-inner{
display:flex;
flex-direction:column;
align-items:center;
gap:10px;
}

.nav-logo img{
height:95px;
display:block;
}

.nav-links{
display:flex;
flex-direction:column;
align-items:center;
gap:8px;
width:100%;
}

.nav-links a{
display:block;
width:100%;
max-width:320px;
text-align:center;
padding:12px 18px;
border-radius:16px;
font-size:1.2em;
font-weight:bold;
text-decoration:none;
color:white;
transition:0.2s ease;
box-sizing:border-box;
}

.nav-links a:hover{
background:rgba(255,255,255,0.15);
}

.nav-links a.active{
background:#67BED9;
box-shadow:inset 0 0 0 3px rgba(255,255,255,0.45);
}

/* desktop */

@media(min-width:700px){

.nav-inner{
flex-direction:row;
justify-content:space-between;
}

.nav-logo img{
height:85px;
}

.nav-links{
flex-direction:row;
justify-content:flex-end;
width:auto;
}

.nav-links a{
width:auto;
max-width:none;
padding:10px 18px;
font-size:1.05em;
}

}

/* ================= CONTACTBOX ================= */

.contact-box{
background:#C9E4FF;
border:3px solid #0179F1;
border-radius:24px;
padding:40px 25px;
text-align:center;
}

.contact-box h1{
font-family:'Anton',sans-serif;
color:#0179F1;
font-size:2.8em;
margin:0 0 10px;
}

.contact-intro{
font-family:'Lobster Two',cursive;
font-size:1.5em;
color:#0179F1;
margin-bottom:35px;
line-height:1.4;
}

/* ================= FORM ================= */

form{
max-width:650px;
margin:0 auto;
display:flex;
flex-direction:column;
gap:18px;
}

input,
textarea{
width:100%;
padding:18px;
font-size:1.15em;
border-radius:18px;
border:3px solid rgba(0,0,0,0.12);
box-sizing:border-box;
font-family:Arial,sans-serif;
}

textarea{
min-height:220px;
resize:vertical;
}

button{
background:#0179F1;
color:#fff;
border:none;
border-radius:18px;
padding:18px;
font-size:1.4em;
font-weight:bold;
cursor:pointer;
transition:0.2s ease;
margin-top:10px;
}

button:hover{
background:#015ec7;
}

/* ================= EXTRA ================= */

.note{
margin-top:25px;
font-size:1em;
color:#555;
text-align:center;
line-height:1.5;
}

footer{
margin-top:40px;
text-align:center;
font-size:0.9em;
color:#666;
}

/* mobiel */

@media(max-width:520px){

.contact-box h1{
font-size:2.2em;
}

.contact-intro{
font-size:1.25em;
}

input,
textarea{
font-size:1.05em;
padding:16px;
}

button{
font-size:1.2em;
}

}

</style>
</head>

<body>

<div class="container">

<!-- NAVBAR -->

<nav class="navbar">

<div class="nav-inner">

<div class="nav-logo">
<a href="index.html">
<img src="logo-bb.png" alt="Boef & Brommie">
</a>
</div>

<div class="nav-links" id="navLinks">
<a href="index.html">Beginpagina</a>
<a href="bestellen.html">Bestellen</a>
<a href="reviews.html">Reviews</a>
<a href="contact.html">Contact</a>
</div>

</div>
</nav>

<!-- CONTACT -->

<div class="contact-box">

<h1>Contact</h1>

<p class="contact-intro">
Heb je een vraag, opmerking of leuk idee?<br>
Stuur gerust een bericht!
</p>

<form action="https://formspree.io/f/mnjwyevz" method="POST" id="contactForm">

<input type="text" name="Naam" placeholder="Naam" required>

<input type="email" name="Email" placeholder="E-mailadres" required>

<input type="text" name="Onderwerp" placeholder="Onderwerp">

<textarea name="Bericht" placeholder="Typ hier je bericht..." required></textarea>

<button type="submit">Verstuur bericht</button>

</form>

<p class="note">
Berichten worden zo snel mogelijk gelezen en beantwoord.
</p>

</div>

<footer>
<p>© Boef & Brommie – bestelboefenbrommie.nl</p>
</footer>

</div>

<script>

/* formulier verzenden */

document.getElementById('contactForm').addEventListener('submit', function(e){

e.preventDefault();

fetch(this.action, {
method: this.method,
body: new FormData(this),
headers: {
'Accept': 'application/json'
}
})
.then(() => {

window.location.href = 'bedankt-contact.html';

})
.catch(() => {

alert('Er is iets misgegaan. Probeer het opnieuw.');

});

});

/* actieve pagina markeren */

(function(){

const path = window.location.pathname.split('/').pop() || 'index.html';

document.querySelectorAll('#navLinks a').forEach(a => {

if(a.getAttribute('href') === path){
a.classList.add('active');
}

});

})();

</script>

</body>
</html>
