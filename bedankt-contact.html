<!DOCTYPE html>
<html lang="nl">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bedankt! – Boef & Brommie</title>

<link rel="icon" type="image/png" href="favicon.png">

<link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Lobster+Two&display=swap" rel="stylesheet">

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:#f7f7f7;
color:#333;
}

.container{
max-width:850px;
margin:0 auto;
padding:40px 20px;
box-sizing:border-box;
}

.thanks-box{
background:#C9E4FF;
border:3px solid #0179F1;
border-radius:24px;
padding:50px 30px;
text-align:center;
}

.logo{
width:220px;
max-width:90%;
margin-bottom:25px;
}

h1{
font-family:'Anton',sans-serif;
font-size:3em;
color:#0179F1;
margin:0 0 20px;
}

.message{
font-size:1.3em;
line-height:1.7;
margin-bottom:35px;
}

.button{
display:inline-block;
background:#0179F1;
color:white;
text-decoration:none;
padding:16px 28px;
border-radius:16px;
font-size:1.2em;
font-weight:bold;
transition:0.2s ease;
}

.button:hover{
background:#015ec7;
}

@media(max-width:520px){

h1{
font-size:2.2em;
}

.message{
font-size:1.1em;
}

.logo{
width:180px;
}

}

</style>
</head>

<body>

<div class="container">

<div class="thanks-box">

<img src="logo-bb.png" alt="Boef & Brommie" class="logo">

<h1>Bedankt voor je bericht!</h1>

<p class="message">
Je bericht is goed ontvangen.<br>
We proberen zo snel mogelijk te reageren.
</p>

<a href="index.html" class="button">
Terug naar de beginpagina
</a>

</div>

</div>

</body>
</html>
